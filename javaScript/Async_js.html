<head>

</head>
<body>

    <button id="stop">stop</button>
</body>
<script>
    // setTimeout(function(){

    // },2000)
    const say=function(){
        console.log("Alice")
    }
    setTimeout(say,2000)

    //document.querySelector('h1').innerHTML='hello world!'
     const changeme= setTimeout(changeTxt,2000)
    

    document.getElementById('stop').addEventListener('click',function(){

        console.log("stoped");
        
    })
</script>
