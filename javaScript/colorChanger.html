    <button id="start">start</button>
    <button id="stop">stop</button>
</body>
<script>
    const colorgenrate=function(){
        const hex='0123456789ABCDEF'
        let color='#'
        for(let i=0;i<6;i++){
            color+=hex[Math.floor(Math.random()*16)];
        }
        return color;
    }
    //let print1;
    //document.querySelector('#start').addEventListener('click',function(){
    //    print1=setInterval(() => {
    //        document.body.style.backgroundColor=colorgenrate()
//
//
    //    }, 1000);
    //})
    //document.querySelector("#stop").addEventListener('click',function(){
    //    clearInterval(print1)
    //})
    let print1;
    const startColor=function(){
        print1=setInterval(function(){
            document.body.style.backgroundColor=colorgenrate()
        },1000)
    }

    const stopColor=function(){
        clearInterval(print1)
    }

    document.querySelector('#start').addEventListener('click',startColor)
    document.querySelector('#stop').addEventListener('click',stopColor)
</script>
